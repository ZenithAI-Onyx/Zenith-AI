<style>
        body {
            background-color: #000000;
            overflow-x: hidden;
        }

            top: 50%;

            transform: translate(-50%, -50%);

            height: 100vh;

            pointer-events: none;
            z-index: 0;
        }
        .glass-surface {
            background: rgba(255, 255, 255, 0.05);

            -webkit-backdrop-filter: blur(40px);

<body class="text-on-background min-h-screen flex flex-col items-center justify-center font-body-md">
<div class="cosmic-glow"></div>
<header class="fixed top-0 left-0 right-0 z-50 bg-transparent backdrop-blur-[40px] border-b-[0.5px] border-white/15">
<div class="flex justify-between items-center w-full px-8 py-6 max-w-[1200px] mx-auto">
<div class="text-2xl font-light tracking-[0.4em] text-white font-['Inter'] uppercase">ZENITH</div>
<nav class="hidden md:flex gap-12">
<a class="font-['Inter'] text-[12px] tracking-widest uppercase transition-all duration-500 hover:bg-white/10 text-white font-medium" href="#">LANGUAGE</a>
<a class="font-['Inter'] text-[12px] tracking-widest uppercase transition-all duration-500 hover:bg-white/10 text-white/40" href="#">VOICE</a>
<a class="font-['Inter'] text-[12px] tracking-widest uppercase transition-all duration-500 hover:bg-white/10 text-white/40" href="#">ACCESS</a>
</nav>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-white text-xl cursor-pointer hover:bg-white/10 transition-all duration-500 p-2 rounded-full">help_outline</span>
</div>
</div>
</header>
<main class="relative z-10 w-full max-w-[1200px] px-gutter flex flex-col items-center pt-32 pb-40">
<div class="mb-12 text-center">
<span class="font-label-caps text-label-caps text-white/40 mb-4 block tracking-[0.3em]">INITIALIZATION</span>
<h1 class="font-display text-display text-white mb-2">SELECT LANGUAGE</h1>
<p class="font-body-lg text-body-lg text-silver/60 max-w-md mx-auto">Choose your preferred medium of interaction for the Zenith AI interface.</p>
</div>
<div class="glass-surface w-full max-w-2xl rounded-xl p-8 md:p-12">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="langGrid">
    <button data-lang="en" class="lang-btn selected flex items-center justify-between w-full p-6 rounded-lg hairline-border bg-white/10 transition-all duration-500 group">
        <div class="flex flex-col items-start">
            <span class="font-h2 text-h2 text-white">English</span>
            <span class="font-label-caps text-[10px] text-white/40 mt-1 uppercase tracking-widest">Global standard</span>
        </div>
        <div class="lang-dot w-1.5 h-1.5 bg-white rounded-full"></div>
    </button>
    <button data-lang="ja" class="lang-btn flex items-center justify-between w-full p-6 rounded-lg hairline-border hover:bg-white/5 transition-all duration-500 group">
        <div class="flex flex-col items-start">
            <span class="font-h2 text-h2 text-white/60 group-hover:text-white transition-colors">日本語</span>
            <span class="font-label-caps text-[10px] text-white/20 mt-1 uppercase tracking-widest group-hover:text-white/40">Japanese</span>
        </div>
        <div class="lang-dot w-1.5 h-1.5 bg-white rounded-full"></div>
    </button>
    <button data-lang="fr" class="lang-btn flex items-center justify-between w-full p-6 rounded-lg hairline-border hover:bg-white/5 transition-all duration-500 group">
        <div class="flex flex-col items-start">
            <span class="font-h2 text-h2 text-white/60 group-hover:text-white transition-colors">Français</span>
            <span class="font-label-caps text-[10px] text-white/20 mt-1 uppercase tracking-widest group-hover:text-white/40">French</span>
        </div>
        <div class="lang-dot w-1.5 h-1.5 bg-white rounded-full"></div>
    </button>
    <button data-lang="de" class="lang-btn flex items-center justify-between w-full p-6 rounded-lg hairline-border hover:bg-white/5 transition-all duration-500 group">
        <div class="flex flex-col items-start">
            <span class="font-h2 text-h2 text-white/60 group-hover:text-white transition-colors">Deutsch</span>
            <span class="font-label-caps text-[10px] text-white/20 mt-1 uppercase tracking-widest group-hover:text-white/40">German</span>
        </div>
        <div class="lang-dot w-1.5 h-1.5 bg-white rounded-full"></div>
    </button>
</div>
<div class="mt-12 flex justify-end">
    <button id="btnNext" class="px-10 py-4 bg-white text-black font-label-caps text-label-caps tracking-[0.2em] uppercase rounded-full hover:bg-gray-200 transition-all duration-500 scale-100 active:scale-95">
        Next
    </button>
</div>
</div>
<div class="mt-20 w-full flex justify-center opacity-30">
<div class="h-[1px] w-1/4 bg-gradient-to-r from-transparent via-white to-transparent"></div>
</div>

<span class="material-symbols-outlined text-xl">mic</span>
<span class="font-['Inter'] text-[10px] tracking-widest uppercase">Voice</span>
</div>
<div class="flex flex-col items-center gap-1 group cursor-pointer text-white/30 hover:text-white/60 transition-colors">
<span class="material-symbols-outlined text-xl">google</span>
<span class="font-['Inter'] text-[10px] tracking-widest uppercase">Access</span>
</div>

<img class="w-full h-full object-cover opacity-10 mix-blend-screen" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXYCLrnNSAgRSaOfqz2tw_qT0kbnDwKaKpAK9qRjIQKX6_S5E1pDl-hi3S89twn1Sy2OEW_zPHKA_RfLU1gCRDKVZaLJbm55Y-tlHUdDcQ4MakJ9jSCq-GlutxSOdXv4XAYE7sq2VmZaR0VjIU14RgCk-SajzawGkm9RuBOa_kQFWvG3qNhpIpdxrDAro8Z97SBNP-eWS53qhjMQlBiTXUmaL7vdjIjWR-rNPS47i1k_vCwapUhj6bYB5KoSKZKyrzWVVxTzR37Kij"/>
</div>

<script>
    // Selección de idioma
    const langBtns = document.querySelectorAll('.lang-btn');
    let selectedLang = 'en';

    langBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            langBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedLang = btn.dataset.lang;
            localStorage.setItem('zenith_lang', selectedLang);
        });
    });

    // Botón Next → ir a voice.html
    document.getElementById('btnNext').addEventListener('click', () => {
        localStorage.setItem('zenith_lang', selectedLang);
        window.location.href = 'voice.html';
    });
</script>
</body></html>
