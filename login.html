<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ZENITH AI — Access</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body {
        background-color: #000000;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
    }
    .cosmic-glow {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 70%);
        pointer-events: none;
        z-index: 0;
    }
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
    }
    .glass-surface {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(40px);
        border: 0.5px solid rgba(255, 255, 255, 0.15);
    }
    .btn-google {
        transition: all 0.4s ease;
    }
    .btn-google:hover {
        background: rgba(255,255,255,0.12);
        transform: translateY(-1px);
    }
    .btn-google:active {
        transform: scale(0.98);
    }
    .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255,255,255,0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(20px);
        border: 0.5px solid rgba(255,255,255,0.2);
        color: white;
        padding: 12px 24px;
        border-radius: 100px;
        font-size: 13px;
        letter-spacing: 0.05em;
        transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        z-index: 999;
        white-space: nowrap;
    }
    .toast.show {
        transform: translateX(-50%) translateY(0);
    }
    .toast.error {
        border-color: rgba(255, 100, 100, 0.4);
        background: rgba(255, 50, 50, 0.1);
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 1s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
    .fade-in-delay { opacity: 0; animation: fadeIn 1s cubic-bezier(0.19, 1, 0.22, 1) 0.3s forwards; }
    .fade-in-delay-2 { opacity: 0; animation: fadeIn 1s cubic-bezier(0.19, 1, 0.22, 1) 0.6s forwards; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<div class="cosmic-glow"></div>

<div class="fixed inset-0 z-[-1] opacity-40">
    <img class="w-full h-full object-cover"
         src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6-GBdz-73FjW1VmoqBJFlh10hsD6NvWDyh6E-PERiSoo8vIF-9iP6ckvIUngTCdM67rIuLoSE6fOzqBMZxF-0JTbCsxOpuBrjXNtKYsAiOTgIld_JsDyDiMujpFkrdHP5ABZ4RuXoC4Bx9VdhrNntkgmQkptf1_bIUkZwagicZ2iFKM8nk6qhGMeRkHAlUjnp4ubdRjahy054olVOBqgW-l6yOFwluV-DvrpIE7NJO9xehB8H0JNx_B5ZqRmDGAkWvfrGpVaJ-SUl"
         alt="Cosmic background"/>
</div>

<header class="fixed top-0 left-0 right-0 z-50 bg-transparent backdrop-blur-[40px] border-b-[0.5px] border-white/10">
    <div class="flex justify-between items-center w-full px-8 py-5 max-w-[1200px] mx-auto">
        <div class="text-xl font-light tracking-[0.4em] text-white uppercase">ZENITH</div>
        <span class="text-white/30 text-xs tracking-widest uppercase">Onyx Corporation</span>
    </div>
</header>

<main class="relative z-10 flex-grow flex items-center justify-center px-6">
    <div class="glass-surface w-full max-w-[420px] p-10 rounded-lg flex flex-col items-center text-center fade-in">

        <div class="w-14 h-14 border-[0.5px] border-white/20 rounded-full flex items-center justify-center mb-8">
            <span class="material-symbols-outlined text-white text-2xl" style="font-variation-settings: 'wght' 100;">
                shutter_speed
            </span>
        </div>

        <h1 class="text-white text-2xl font-extralight tracking-[0.08em] mb-2 fade-in-delay">
            Onyx Corporation
        </h1>
        <p class="text-white/40 text-sm font-light tracking-wide mb-10 fade-in-delay">
            Vincula tu identidad para comenzar.
        </p>

        <button id="btnGoogle"
            class="btn-google glass-surface w-full py-4 px-6 flex items-center justify-center gap-3 rounded-lg mb-4 fade-in-delay-2">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
                <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            <span id="btnGoogleText" class="text-white text-xs font-medium tracking-[0.15em] uppercase">
                Continuar con Google
            </span>
            <div class="spinner" id="googleSpinner"></div>
        </button>

        <div class="w-full flex items-center gap-4 my-2 fade-in-delay-2">
            <div class="flex-1 h-[0.5px] bg-white/10"></div>
            <span class="text-white/20 text-[10px] tracking-widest uppercase">o</span>
            <div class="flex-1 h-[0.5px] bg-white/10"></div>
        </div>

        <button id="btnPhone"
            class="btn-google glass-surface w-full py-4 px-6 flex items-center justify-center gap-3 rounded-lg mt-2 fade-in-delay-2">
            <span class="material-symbols-outlined text-white text-lg">phone_iphone</span>
            <span class="text-white text-xs font-medium tracking-[0.15em] uppercase">
                Continuar con teléfono
            </span>
        </button>

        <div class="mt-10 pt-6 border-t-[0.5px] border-white/10 w-full fade-in-delay-2">
            <p class="text-[10px] text-white/20 tracking-[0.2em] uppercase mb-3">Zenith AI — Onyx Corporation</p>
            <div class="flex justify-center gap-6">
                <a href="#" class="text-[10px] uppercase tracking-widest text-white/30 hover:text-white transition-colors">Privacidad</a>
                <a href="#" class="text-[10px] uppercase tracking-widest text-white/30 hover:text-white transition-colors">Términos</a>
            </div>
        </div>
    </div>
</main>

<footer class="fixed bottom-8 left-0 right-0 z-10 pointer-events-none text-center">
    <div style="font-family:'Courier New',monospace; color:#808080; opacity:0.15; font-size:7vw; letter-spacing:-0.02em; line-height:1; user-select:none;">
        Define Your Future
    </div>
</footer>

<div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp }     from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAnalytics }      from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";
    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey:            "AIzaSyCB1B3c2KQpxz6jg3zb42KFElKvUEJwIys",
        authDomain:        "zenithai-7402f.firebaseapp.com",
        projectId:         "zenithai-7402f",
        storageBucket:     "zenithai-7402f.firebasestorage.app",
        messagingSenderId: "867733192607",
        appId:             "1:867733192607:web:c54dcd65f6f8fdd15b47aa",
        measurementId:     "G-8X614XE6XB"
    };

    const app       = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth      = getAuth(app);
    const provider  = new GoogleAuthProvider();

    const btnGoogle     = document.getElementById('btnGoogle');
    const btnGoogleText = document.getElementById('btnGoogleText');
    const googleSpinner = document.getElementById('googleSpinner');
    const btnPhone      = document.getElementById('btnPhone');
    const toast         = document.getElementById('toast');

    function showToast(msg, isError = false) {
        toast.textContent = msg;
        toast.className   = 'toast' + (isError ? ' error' : '');
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Si ya hay sesión activa, redirige directo a language.html
    onAuthStateChanged(auth, (user) => {
        if (user) {
            showToast('✓ Sesión activa — redirigiendo...');
            setTimeout(() => { window.location.href = 'language.html'; }, 1000);
        }
    });

    // Login con Google
    btnGoogle.addEventListener('click', async () => {
        btnGoogleText.style.display = 'none';
        googleSpinner.style.display = 'block';
        btnGoogle.disabled          = true;

        try {
            const result = await signInWithPopup(auth, provider);
            const user   = result.user;
            showToast(`✓ Bienvenido, ${user.displayName}`);
            setTimeout(() => { window.location.href = 'language.html'; }, 1200);
        } catch (error) {
            btnGoogleText.style.display = 'inline';
            googleSpinner.style.display = 'none';
            btnGoogle.disabled          = false;

            if (error.code === 'auth/popup-closed-by-user') {
                showToast('Ventana cerrada. Intenta de nuevo.', true);
            } else {
                showToast('Error al iniciar sesión. Intenta de nuevo.', true);
                console.error('[ZENITH Auth]', error);
            }
        }
    });

    // Teléfono — próximamente
    btnPhone.addEventListener('click', () => {
        showToast('Autenticación por teléfono — próximamente.');
    });
</script>

</body>
</html>
