<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZENITH AI — Onyx Corporation</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@100;200;300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
width:100%; height:100%;
background:#000005;
overflow:hidden;
font-family:'Inter', sans-serif;
}

/* Stars */
#starfield {
position:fixed; inset:0; z-index:0; pointer-events:none;
}

/* Ambient glow — sutil, idéntico al de voice.html y language.html */
.ambient {
position:fixed; inset:0; z-index:1; pointer-events:none;
background: radial-gradient(ellipse 70% 50% at 50% 60%,
rgba(255,255,255,0.025) 0%, transparent 70%);
}

/* Corner hairlines */
.corner { position:fixed; z-index:5; pointer-events:none; }
.corner–tl { top:32px; left:32px; }
.corner–br { bottom:32px; right:32px; }
.corner–tl::before, .corner–tl::after,
.corner–br::before, .corner–br::after {
content:''; position:absolute; background:rgba(255,255,255,0.12);
}
.corner–tl::before { width:48px; height:0.5px; top:0; left:0; }
.corner–tl::after  { width:0.5px; height:48px; top:0; left:0; }
.corner–br::before { width:48px; height:0.5px; bottom:0; right:0; }
.corner–br::after  { width:0.5px; height:48px; bottom:0; right:0; }

/* Main content */
main {
position:fixed; inset:0; z-index:10;
display:flex; flex-direction:column;
align-items:center; justify-content:center;
gap:0;
background:transparent;
}

/* ── LOGO PRINCIPAL ──
- Sin wrapper extra
- Sin text-shadow (los radios grandes crean un artefacto rectangular en el navegador)
- Sin background, box-shadow, backdrop-filter ni filtro de ningún tipo
- display:block para que no hereden box de inline */
.logo-zenith {
font-family: 'Great Vibes', cursive;
font-size: clamp(4rem, 12vw, 8rem);
color: rgba(255, 255, 255, 0.92);
line-height: 1.1;
letter-spacing: 0.02em;
display: block;
text-align: center;
background: transparent;
opacity: 0;
animation: logoReveal 1.8s cubic-bezier(0.19, 1, 0.22, 1) 0.3s forwards;
}

@keyframes logoReveal {
0%   { opacity: 0; transform: translateY(22px); }
100% { opacity: 1; transform: translateY(0);    }
}

/* Subtitle */
.subtitle {
font-family: 'Great Vibes', cursive;
font-size: clamp(1.1rem, 3vw, 1.5rem);
color: rgba(255,255,255,0.6);
letter-spacing: 0.05em;
margin-top: 16px;
opacity: 0;
animation: fadeRise 1s cubic-bezier(0.19,1,0.22,1) 1.9s forwards;
}

/* Tagline */
.tagline {
font-size: 10px;
letter-spacing: 0.45em;
color: rgba(255,255,255,0.18);
text-transform: uppercase;
font-weight: 300;
margin-top: 20px;
opacity: 0;
animation: fadeRise 1s ease 2.3s forwards;
}

/* Glass button */
.btn-letsgo {
margin-top: 52px;
padding: 15px 52px;
font-family: 'Inter', sans-serif;
font-size: 11px;
font-weight: 400;
letter-spacing: 0.3em;
text-transform: uppercase;
color: white;
text-decoration: none;
background: rgba(255,255,255,0.05);
border: 0.5px solid rgba(255,255,255,0.2);
border-radius: 9999px;
backdrop-filter: blur(20px);
cursor: pointer;
position: relative;
overflow: hidden;
opacity: 0;
animation: fadeRise 0.9s cubic-bezier(0.19,1,0.22,1) 2.7s forwards;
display: inline-block;
transition: background 0.4s ease, border-color 0.4s ease;
}
.btn-letsgo::before {
content: '';
position: absolute; top:0; left:-100%;
width:100%; height:100%;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
transition: left 0.6s ease;
}
.btn-letsgo:hover::before { left:100%; }
.btn-letsgo:hover {
background: rgba(255,255,255,0.10);
border-color: rgba(255,255,255,0.35);
}

/* Animación compartida */
@keyframes fadeRise {
from { opacity:0; transform:translateY(12px); }
to   { opacity:1; transform:translateY(0);    }
}

/* Header brand */
.brand-header {
position:fixed; top:0; left:0; right:0; z-index:20;
padding: 22px 32px;
display:flex; justify-content:space-between; align-items:center;
opacity:0;
animation: fadeRise 1s ease 3.1s forwards;
background: transparent;
}
.brand-name {
font-size:13px; font-weight:300;
letter-spacing:0.42em; color:white; text-transform:uppercase;
}
.brand-corp {
font-size:9px; font-weight:300;
letter-spacing:0.32em; color:rgba(255,255,255,0.3); text-transform:uppercase;
}
</style>

</head>
<body>

<div id="starfield"></div>
<div class="ambient"></div>
<div class="corner corner--tl"></div>
<div class="corner corner--br"></div>

<div class="brand-header">
  <span class="brand-name">Zenith</span>
  <span class="brand-corp">Onyx Corporation</span>
</div>

<main>
  <span class="logo-zenith">Zenith</span>
  <div class="subtitle">Artificial Intelligence</div>
  <div class="tagline">Next Generation · Intelligence System</div>
  <a href="language.html" class="btn-letsgo">Let's Go</a>
</main>

<script>
/* ── STARFIELD ── */
const sf = document.getElementById('starfield');
for (let i = 0; i < 200; i++) {
  const d   = document.createElement('div');
  const s   = Math.random() * 1.4 + 0.3;
  const a   = (Math.random() * 0.4 + 0.05).toFixed(2);
  const dur = (Math.random() * 5 + 3).toFixed(1);
  d.style.cssText =
    `position:absolute;border-radius:50%;background:white;` +
    `width:${s}px;height:${s}px;` +
    `left:${Math.random()*100}%;top:${Math.random()*100}%;` +
    `opacity:${a};animation:tw ${dur}s ${(Math.random()*4).toFixed(1)}s ease-in-out infinite alternate;`;
  sf.appendChild(d);
}
const sStyle = document.createElement('style');
sStyle.textContent = `@keyframes tw{from{opacity:0.03}to{opacity:0.45}}`;
document.head.appendChild(sStyle);
</script>

</body>
</html>
