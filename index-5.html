<style>
        @keyframes drawFade {
            0% { opacity: 0; letter-spacing: 1em; filter: blur(10px); }
            100% { opacity: 1; letter-spacing: 0.4em; filter: blur(0px); }
        }
        .animate-zenith {
            animation: drawFade 3s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }
        .cosmic-glow {
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0) 70%);
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .btn-enter {
            opacity: 0;
            animation: fadeInUp 1s cubic-bezier(0.19, 1, 0.22, 1) 3.5s forwards;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255,255,255,0.2);
            color: white;
            padding: 14px 48px;
            border-radius: 9999px;
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 48px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-enter:hover {
            background: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }
    </style>

</div>
<a href="login.html" class="btn-enter">Ingresar</a>
