<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZENITH AI — Language</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@100;200;300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    min-height:100%; background:#000005;
    font-family:'Inter', sans-serif;
    color:white;
  }

  /* Stars */
  #starfield { position:fixed; inset:0; z-index:0; pointer-events:none; }

  .ambient {
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(ellipse 80% 60% at 50% 70%,
      rgba(255,255,255,0.02) 0%, transparent 70%);
  }

  /* Header */
  header {
    position:fixed; top:0; left:0; right:0; z-index:50;
    padding:20px 32px;
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(0,0,5,0.6);
    backdrop-filter:blur(40px);
    border-bottom:0.5px solid rgba(255,255,255,0.08);
  }
  .brand { font-size:13px; font-weight:300; letter-spacing:0.42em; text-transform:uppercase; }
  nav { display:flex; gap:32px; }
  .nav-link {
    font-size:10px; font-weight:400; letter-spacing:0.28em; text-transform:uppercase;
    color:rgba(255,255,255,0.3); text-decoration:none;
    transition:color 0.3s;
    cursor:pointer;
  }
  .nav-link.active { color:white; }
  .nav-link:hover { color:rgba(255,255,255,0.7); }

  /* Main layout */
  main {
    position:relative; z-index:10;
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:100px 24px 80px;
  }

  /* Page header text */
  .step-label {
    font-size:10px; font-weight:300;
    letter-spacing:0.4em; text-transform:uppercase;
    color:rgba(255,255,255,0.25);
    margin-bottom:16px;
    opacity:0; animation:fadeUp 0.8s ease 0.1s forwards;
  }

  /* CURSIVE title */
  .page-title {
    font-family:'Great Vibes', cursive;
    font-size: clamp(2.8rem, 8vw, 4.5rem);
    font-weight:400;
    color:white;
    line-height:1.1;
    margin-bottom:10px;
    opacity:0; animation:fadeUp 0.9s ease 0.2s forwards;
  }

  .page-desc {
    font-size:13px; font-weight:300;
    color:rgba(255,255,255,0.35);
    letter-spacing:0.04em;
    margin-bottom:48px;
    opacity:0; animation:fadeUp 0.9s ease 0.3s forwards;
  }

  /* Language grid */
  .lang-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    width:100%;
    max-width:480px;
    margin-bottom:40px;
    opacity:0; animation:fadeUp 0.9s ease 0.4s forwards;
  }

  .lang-card {
    position:relative;
    padding:24px 22px;
    background:rgba(255,255,255,0.04);
    border:0.5px solid rgba(255,255,255,0.1);
    border-radius:12px;
    cursor:pointer;
    transition:background 0.35s, border-color 0.35s;
    overflow:hidden;
    text-align:left;
  }
  .lang-card:hover {
    background:rgba(255,255,255,0.07);
    border-color:rgba(255,255,255,0.2);
  }
  .lang-card.selected {
    background:rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.3);
  }
  .lang-card.selected::after {
    content:'';
    position:absolute; top:0; left:0; right:0;
    height:0.5px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  }
  .lang-name {
    display:block;
    font-size:16px; font-weight:300; color:white;
    margin-bottom:4px;
    letter-spacing:0.02em;
  }
  .lang-sub {
    font-size:9px; font-weight:400;
    letter-spacing:0.22em; text-transform:uppercase;
    color:rgba(255,255,255,0.25);
  }
  .lang-dot {
    position:absolute; top:16px; right:16px;
    width:6px; height:6px;
    background:white; border-radius:50%;
    opacity:0; transition:opacity 0.3s;
  }
  .lang-card.selected .lang-dot { opacity:1; }

  /* Continue button */
  .btn-continue {
    display:inline-flex; align-items:center; gap:12px;
    padding:15px 48px;
    font-size:11px; font-weight:400;
    letter-spacing:0.3em; text-transform:uppercase;
    color:white;
    background:rgba(255,255,255,0.05);
    border:0.5px solid rgba(255,255,255,0.18);
    border-radius:9999px;
    backdrop-filter:blur(20px);
    cursor:pointer;
    transition:background 0.35s, border-color 0.35s, transform 0.2s;
    opacity:0; animation:fadeUp 0.9s ease 0.55s forwards;
    text-decoration:none;
  }
  .btn-continue:hover {
    background:rgba(255,255,255,0.1);
    border-color:rgba(255,255,255,0.35);
    transform:translateY(-1px);
  }
  .btn-continue:active { transform:scale(0.98); }
  .btn-arrow { font-size:14px; opacity:0.45; font-weight:200; }

  /* Bottom nav bar */
  .bottom-nav {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    z-index:50;
    display:flex; gap:0; align-items:center;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(40px);
    border:0.5px solid rgba(255,255,255,0.1);
    border-radius:9999px;
    overflow:hidden;
    opacity:0; animation:fadeUp 0.9s ease 0.7s forwards;
  }
  .bottom-nav-item {
    display:flex; flex-direction:column; align-items:center;
    gap:5px; padding:12px 24px;
    cursor:pointer;
    transition:background 0.3s;
    color:rgba(255,255,255,0.3);
    font-size:9px; letter-spacing:0.2em; text-transform:uppercase; font-weight:400;
  }
  .bottom-nav-item.active { color:white; }
  .bottom-nav-item:hover { background:rgba(255,255,255,0.05); }
  .nav-icon { font-size:16px; line-height:1; margin-bottom:2px; }

  /* Corner hairlines */
  .corner { position:fixed; z-index:5; pointer-events:none; }
  .corner--tl { top:32px; left:32px; }
  .corner--br { bottom:32px; right:32px; }
  .corner--tl::before,.corner--tl::after,.corner--br::before,.corner--br::after {
    content:''; position:absolute; background:rgba(255,255,255,0.08);
  }
  .corner--tl::before { width:40px; height:0.5px; }
  .corner--tl::after  { width:0.5px; height:40px; }
  .corner--br::before { width:40px; height:0.5px; bottom:0; right:0; }
  .corner--br::after  { width:0.5px; height:40px; bottom:0; right:0; }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>

<div id="starfield"></div>
<div class="ambient"></div>
<div class="corner corner--tl"></div>
<div class="corner corner--br"></div>

<header>
  <span class="brand">Zenith</span>
  <nav>
    <span class="nav-link active">Language</span>
    <span class="nav-link" onclick="window.location.href='voice.html'">Voice</span>
    <span class="nav-link" onclick="window.location.href='login.html'">Access</span>
  </nav>
</header>

<main>
  <div class="step-label">Initialization · Step 01</div>
  <h1 class="page-title">Select Language</h1>
  <p class="page-desc">Choose your preferred medium of interaction.</p>

  <div class="lang-grid" id="langGrid">
    <div class="lang-card selected" data-lang="en" onclick="selectLang(this)">
      <span class="lang-name">English</span>
      <span class="lang-sub">English · Global</span>
      <div class="lang-dot"></div>
    </div>
    <div class="lang-card" data-lang="es" onclick="selectLang(this)">
      <span class="lang-name">Español</span>
      <span class="lang-sub">Spanish · Latin</span>
      <div class="lang-dot"></div>
    </div>
    <div class="lang-card" data-lang="ja" onclick="selectLang(this)">
      <span class="lang-name">日本語</span>
      <span class="lang-sub">Japanese · 日本</span>
      <div class="lang-dot"></div>
    </div>
    <div class="lang-card" data-lang="fr" onclick="selectLang(this)">
      <span class="lang-name">Français</span>
      <span class="lang-sub">French · Europe</span>
      <div class="lang-dot"></div>
    </div>
  </div>

  <a href="voice.html" class="btn-continue" id="btnNext">
    Continue <span class="btn-arrow">→</span>
  </a>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-item active">
    <span class="nav-icon">◉</span>
    Language
  </div>
  <div class="bottom-nav-item" onclick="window.location.href='voice.html'">
    <span class="nav-icon">◎</span>
    Voice
  </div>
  <div class="bottom-nav-item" onclick="window.location.href='login.html'">
    <span class="nav-icon">◌</span>
    Access
  </div>
</nav>

<script>
/* Stars */
const sf = document.getElementById('starfield');
for (let i=0;i<180;i++) {
  const d=document.createElement('div');
  const s=Math.random()*1.3+0.3, a=(Math.random()*0.35+0.04).toFixed(2);
  d.style.cssText=`position:absolute;border-radius:50%;background:white;width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${a};animation:tw ${(Math.random()*5+3).toFixed(1)}s ${(Math.random()*4).toFixed(1)}s ease-in-out infinite alternate;`;
  sf.appendChild(d);
}
const ss=document.createElement('style');
ss.textContent=`@keyframes tw{from{opacity:0.02}to{opacity:0.4}}`;
document.head.appendChild(ss);

function selectLang(card) {
  document.querySelectorAll('.lang-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  localStorage.setItem('zenith_lang', card.dataset.lang);
}
</script>
</body>
</html>
